    # Se copia tal cual a las propiedades del feature y al README.
    advertencia: >-
      Geometría APROXIMADA, no oficial. El corte contra Perené (art. 3.1.b)
      sigue en su mayoría thalwegs de quebradas y ríos, vaguadas, divisorias
      de aguas, estribaciones/líneas de cumbres y ejes de vía: de los 25
      tramos, sólo 4 son "línea recta" por definición legal (1->2, 13->14,
      15->16, 17->18). Los demás se trazan aquí uniendo con rectas los
      puntos de referencia que da la memoria, porque este pipeline no tiene
      fuente hidrológica ni modelo de elevación para seguir el accidente
      real. Entre los puntos 499 999 E/8 784 021 N y 498 046 E/8 786 198 N
      la propia ley nombra dos cumbres intermedias (cerro sin nombre cota
      1340, sur y norte) sin darles coordenadas: la recta usada las salta
      por completo. No usar para deslindes.
