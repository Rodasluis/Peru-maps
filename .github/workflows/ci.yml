name: validación

# El CI no descarga nada del INEI. Las capas se construyen en local con
# descargar.py / construir.py / publicar.py y el resultado se versiona en
# salida/, que es lo que consume quien usa el repositorio. Aquí sólo se valida
# ese resultado.
#
# Depender del servidor del INEI en cada push volvía el CI rehén de su
# disponibilidad: desde los runners de GitHub devuelve ConnectTimeout.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # Los dos tests que necesitan fuentes/ (las capas crudas del INEI, ~80 MB,
      # no versionadas) hacen skip solos; los otros 50 corren contra las capas
      # publicadas.
      - name: Suite de validación
        run: python -m pytest -q

      # Los conteos salen de config.yml, no escritos a mano: la cartografía y el
      # registro oficial de ubigeos NO tienen por qué coincidir. Hoy no lo hacen
      # —se publica Sangani (120307), que el SISCONCODE todavía no lista— y esa
      # diferencia está declarada en config.yml, no escondida aquí.
      - name: Coherencia de lo publicado
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          import yaml

          cfg = yaml.safe_load(Path('config.yml').read_text(encoding='utf-8'))
          publicado = cfg['conteos_esperados']     # lo que sale en salida/*.geojson
          registro = cfg['ubigeos_oficiales']      # lo que lista el SISCONCODE

          conteo = {}
          for r in csv.DictReader(
                  open('salida/ubigeos_2025.csv', encoding='utf-8', newline='')):
              conteo[r['nivel']] = conteo.get(r['nivel'], 0) + 1
          assert conteo == registro, f'ubigeos_2025.csv: {conteo} != {registro}'

          for nivel, n in publicado.items():
              feats = json.loads(Path(f'salida/{nivel}.geojson')
                                 .read_text(encoding='utf-8'))['features']
              assert len(feats) == n, f'{nivel}.geojson: {len(feats)} != {n}'
              simp = json.loads(Path(f'salida/{nivel}_simplificado.geojson')
                                .read_text(encoding='utf-8'))['features']
              assert len(simp) == n, f'{nivel}_simplificado: {len(simp)} != {n}'

          censo = list(csv.DictReader(
              open('ejemplos/datos/censo.csv', encoding='utf-8', newline='')))
          suma = sum(float(r['total']) for r in censo
                     if r['nivel'] == 'distrito' and r['total'])
          assert round(suma) == 34_157_732, suma

          print('capas, ubigeos y datos de ejemplo: coherentes')
          PY
